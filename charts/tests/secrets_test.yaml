suite: Role password Secrets from Infisical
templates:
  - templates/role-secrets.yaml
release:
  name: pg-test
  namespace: test
values:
  - ../ci/all-on-values.yaml
tests:
  - it: renders one InfisicalStaticSecret for the owner and one per role
    asserts:
      - hasDocuments: { count: 3 }
      - isKind: { of: InfisicalStaticSecret }
      - equal: { path: metadata.name, value: pg-test-admin-credentials }
        documentIndex: 0
      - equal: { path: metadata.name, value: app-one-database-credentials-secret }
        documentIndex: 1
      - equal: { path: metadata.name, value: app-two-credentials }
        documentIndex: 2

  - it: writes username = role name and the password from the mapped key, as basic-auth
    documentIndex: 1
    asserts:
      - equal:
          path: spec.targets[0]
          value:
            name: app-one-database-credentials-secret
            namespace: test
            kind: Secret
            secretType: kubernetes.io/basic-auth
            creationPolicy: Orphan
            metadata:
              labels:
                cnpg.io/reload: "true"
              annotations:
                reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
                reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
                reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: app-one,app-one-uat
            template:
              engineVersion: v1
              data:
                username: app-one
                password: "{{ .APP_ONE_PASSWORD.Value }}"

  - it: uses the role environment override and the shared Infisical connection
    documentIndex: 1
    asserts:
      - equal:
          path: spec.sources[0]
          value: { projectSlug: fake-project, environmentSlug: fake-staging, secretPath: /fake/app-one }
      - equal: { path: spec.infisicalAuthRef, value: { name: fake-auth, namespace: fake-auth-namespace } }
      - equal: { path: spec.syncOptions.refreshInterval, value: 1m }

  - it: uses the default environment, password key and empty annotations without reflectTo
    documentIndex: 2
    asserts:
      - equal: { path: "spec.sources[0].environmentSlug", value: fake-env }
      - equal: { path: "spec.targets[0].template.data.password", value: "{{ .password.Value }}" }
      - equal: { path: "spec.targets[0].metadata.annotations", value: {} }
      - equal: { path: "spec.targets[0].metadata.labels", value: { cnpg.io/reload: "true" } }

  - it: writes the owner username and the default owner path
    documentIndex: 0
    set:
      bootstrap.passwordSecret.secretPath: ""
    asserts:
      - equal: { path: "spec.targets[0].template.data.username", value: pg-test-admin }
      - equal: { path: "spec.sources[0].secretPath", value: /cnpg/pg-test/users/admin }
