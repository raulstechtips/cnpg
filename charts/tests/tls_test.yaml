suite: TLS Certificate
templates:
  - templates/certificate.yaml
release:
  name: pg-test
  namespace: test
tests:
  - it: issues the server certificate from the internal CA for the 12 service names
    asserts:
      - isKind: { of: Certificate }
      - equal: { path: metadata.name, value: pg-test-cnpg-cluster-internal-certificate }
      - equal: { path: spec.secretName, value: pg-test-cnpg-cluster-internal-tls }
      - equal: { path: spec.secretTemplate, value: { labels: { cnpg.io/reload: "" } } }
      - equal: { path: spec.duration, value: 8760h }
      - equal: { path: spec.renewBefore, value: 720h }
      - equal: { path: spec.subject.organizations, value: [raulstechtips] }
      - equal: { path: spec.issuerRef, value: { name: raulstechtips-internal-ca-issuer, kind: ClusterIssuer } }
      - equal:
          path: spec.dnsNames
          value:
            - pg-test-cnpg-cluster-rw
            - pg-test-cnpg-cluster-rw.test
            - pg-test-cnpg-cluster-rw.test.svc
            - pg-test-cnpg-cluster-rw.test.svc.cluster.local
            - pg-test-cnpg-cluster-ro
            - pg-test-cnpg-cluster-ro.test
            - pg-test-cnpg-cluster-ro.test.svc
            - pg-test-cnpg-cluster-ro.test.svc.cluster.local
            - pg-test-cnpg-cluster-r
            - pg-test-cnpg-cluster-r.test
            - pg-test-cnpg-cluster-r.test.svc
            - pg-test-cnpg-cluster-r.test.svc.cluster.local

  - it: renders no Certificate when TLS is off
    set:
      tls.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
