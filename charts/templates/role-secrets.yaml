{{- /* One InfisicalStaticSecret for the bootstrap owner and one for each managed role. */ -}}
{{- $boot := omit (.Values.bootstrap.passwordSecret | default dict) "reflectTo" -}}
{{- $_ := set $boot "secretPath" ($boot.secretPath | default (printf "/cnpg/%s/users/admin" .Release.Name)) -}}
{{ include "cnpg-cluster.roleSecret" (dict "root" $ "role" (include "cnpg-cluster.ownerName" $) "secret" $boot) }}
{{- range .Values.roles }}
---
{{ include "cnpg-cluster.roleSecret" (dict "root" $ "role" .name "secret" .passwordSecret) }}
{{- end }}
